name: Bump Tool Versions

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Bypass release age cooldown"
        type: boolean
        default: false
  schedule:
    - cron: "0 3 * * 0"

concurrency:
  group: update-packages
  cancel-in-progress: false

jobs:
  update-tool-versions:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python and uv
        uses: tankdonut/github-actions/actions/setup-python-uv@v1

      - name: Sync Dependencies
        run: uv sync

      - name: Configure git
        uses: tankdonut/github-actions/actions/git-bot-config@v1

      - name: Run Update Automation
        run: |
          ARGS="--pr"
          if [ "${{ inputs.force }}" = "true" ]; then
            ARGS="$ARGS --cooldown 0"
          fi
          uv run invoke tools.update $ARGS
        env:
          GH_TOKEN: ${{ secrets.BUMP_PAT }}
