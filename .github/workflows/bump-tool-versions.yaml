name: Bump Tool Versions

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Bypass release age cooldown"
        type: boolean
        default: false
  schedule:
    - cron: "0 3 * * 0"

concurrency:
  group: update-packages
  cancel-in-progress: false

jobs:
  update-tool-versions:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6

      - run: pip install uv

      - run: uv sync

      - name: Configure git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run Update Automation
        run: |
          ARGS="--pr"
          if [ "${{ inputs.force }}" = "true" ]; then
            ARGS="$ARGS --cooldown 0"
          fi
          uv run invoke tools.update $ARGS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
