name: Build & Publish Image

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CONTAINER_REGISTRY: ghcr.io/${{ github.repository }}
      CI: "true"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Python and uv
        uses: tankdonut/github-actions/actions/setup-python-uv@v1

      - name: Sync Dependencies
        run: uv sync

      - name: Build Container
        run: uv run invoke build.container

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: tankdonut/github-actions/actions/ghcr-login@v1

      - name: Build and Push Container
        if: github.event_name != 'pull_request'
        run: uv run invoke build.container --push
