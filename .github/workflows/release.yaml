name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cut-tag:
    # Fires on every push to main (e.g. the weekly tools.update --pr bump
    # merge, which is authored by BUMP_PAT and therefore does trigger
    # workflows). When the push changed tool versions in
    # tasks/metadata.yaml, wait for the commit's container image and cut
    # the next CalVer tag. The release job below then publishes, chained
    # in this same run.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.detect.outputs.has_changes }}
      calver_tag: ${{ steps.detect.outputs.calver_tag }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python and uv
        uses: tankdonut/github-actions/actions/setup-python-uv@v1

      - name: Sync Dependencies
        run: uv sync

      - name: Detect version changes and calculate CalVer tag
        id: detect
        # Diff base resolution (latest release tag, else parent of the
        # most recent metadata.yaml change) lives in tasks/release.py.
        run: uv run inv release.detect

      - name: Report idempotent skip
        if: >-
          steps.detect.outputs.has_changes == 'true' &&
          steps.detect.outputs.skip == 'true'
        run: >-
          echo "Tag ${{ steps.detect.outputs.calver_tag }} already cut;
          the release job will verify publishing is complete."

      - name: Install crane
        if: >-
          steps.detect.outputs.has_changes == 'true' &&
          steps.detect.outputs.skip != 'true'
        run: |
          CRANE_VERSION="0.20.2"
          curl -sL "https://github.com/google/go-containerregistry/releases/download/v${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz" \
            | tar -xzf - crane
          sudo mv crane /usr/local/bin/crane

      - name: Login to GHCR
        if: >-
          steps.detect.outputs.has_changes == 'true' &&
          steps.detect.outputs.skip != 'true'
        uses: tankdonut/github-actions/actions/ghcr-login@v1
        with:
          runtime: "crane"

      - name: Wait for commit image
        # The Build & Publish Image workflow builds image:<sha> from this
        # same push concurrently. A release tag must never exist before its
        # image does (the release would reference an image that can 404 or
        # silently never appear if the build failed), so block here before
        # tagging and fail loudly if the image never arrives.
        if: >-
          steps.detect.outputs.has_changes == 'true' &&
          steps.detect.outputs.skip != 'true'
        run: |
          IMAGE="ghcr.io/${{ github.repository }}"
          SHA="${{ github.sha }}"
          for i in $(seq 1 30); do
            if crane digest "${IMAGE}:${SHA}" >/dev/null 2>&1; then
              echo "Image ${IMAGE}:${SHA} is available."
              exit 0
            fi
            echo "Waiting for image... attempt $i/30"
            sleep 30
          done
          echo "::error::Image ${IMAGE}:${SHA} not found after 15 minutes"
          exit 1

      - name: Configure git
        if: >-
          steps.detect.outputs.has_changes == 'true' &&
          steps.detect.outputs.skip != 'true'
        uses: tankdonut/github-actions/actions/git-bot-config@v1

      - name: Create and push release tag
        if: >-
          steps.detect.outputs.has_changes == 'true' &&
          steps.detect.outputs.skip != 'true'
        run: |
          TAG="${{ steps.detect.outputs.calver_tag }}"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

  release:
    # Chained after cut-tag in the SAME run, not via `on: push: tags`:
    # a tag pushed with the workflow's GITHUB_TOKEN does not fire new
    # workflow runs (GITHUB_TOKEN-created events never trigger workflows
    # — the same rule that forces BUMP_PAT to exist for the bump PRs), so
    # a tag-push trigger could only work for manually cut tags. Ordering
    # guarantee: cut-tag verified the commit image exists before tagging,
    # so this job can never publish a release whose image is missing.
    # Runs whenever version changes were detected — including when the
    # tag was already cut — because every publishing step below is
    # idempotent, making this job safe to re-run after a partial failure.
    needs: [cut-tag]
    if: >-
      needs.cut-tag.result == 'success' &&
      needs.cut-tag.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ needs.cut-tag.outputs.calver_tag }}
    steps:
      - name: Checkout Repository
        # Full history: the changelog diff spans the previous release tag
        # to this one, and the CalVer tags pushed by cut-tag must be
        # visible here (fetch-depth: 0 fetches all tags and branches).
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python and uv
        uses: tankdonut/github-actions/actions/setup-python-uv@v1

      - name: Sync Dependencies
        run: uv sync

      - name: Install crane
        run: |
          CRANE_VERSION="0.20.2"
          curl -sL "https://github.com/google/go-containerregistry/releases/download/v${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz" \
            | tar -xzf - crane
          sudo mv crane /usr/local/bin/crane

      - name: Login to GHCR
        uses: tankdonut/github-actions/actions/ghcr-login@v1
        with:
          runtime: "crane"

      - name: Resolve previous release tag
        id: prev
        run: |
          TAG="${RELEASE_TAG}"
          PREV=$(git tag -l '20*' | sort -V | awk -v t="$TAG" '$0==t{print p} {p=$0}')
          echo "prev_tag=${PREV:-}" >> "$GITHUB_OUTPUT"

      - name: Tag container image
        # Fail fast if the image is missing rather than publishing a
        # release that references an unavailable image.
        id: image_digest
        run: |
          IMAGE="ghcr.io/${{ github.repository }}"
          SHA="${{ github.sha }}"
          DIGEST=$(crane digest "${IMAGE}:${SHA}")
          crane tag "${IMAGE}:${SHA}" "${RELEASE_TAG}"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Build release notes
        env:
          PREV_TAG: ${{ steps.prev.outputs.prev_tag }}
          IMAGE_DIGEST: ${{ steps.image_digest.outputs.digest }}
        run: uv run inv release.notes

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} already exists; skipping creation."
            exit 0
          fi
          gh release create "${RELEASE_TAG}" \
            --title "${RELEASE_TAG}" \
            --notes-file release-notes.md

      - name: Configure git
        uses: tankdonut/github-actions/actions/git-bot-config@v1

      - name: Update CHANGELOG.md and pyproject.toml
        env:
          PREV_TAG: ${{ steps.prev.outputs.prev_tag }}
        run: |
          TAG="${RELEASE_TAG}"
          git checkout -B main origin/main
          if [ -f CHANGELOG.md ] && grep -q "^## ${TAG} " CHANGELOG.md; then
            echo "Changelog entry for ${TAG} already present; skipping."
            exit 0
          fi
          uv run inv release.changelog
          git add CHANGELOG.md pyproject.toml
          if git diff --cached --quiet; then
            echo "Nothing to commit; changelog and version already up to date."
            exit 0
          fi
          git commit -m "chore: release ${TAG}"
          git push origin main
