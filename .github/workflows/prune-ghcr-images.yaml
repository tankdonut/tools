name: Prune GHCR Images

on:
  workflow_dispatch: # Allows manual triggering
  schedule:
    - cron: "30 1 * * *" # Runs daily at 01:30 UTC

permissions:
  packages: write

jobs:
  prune:
    uses: tankdonut/github-actions/.github/workflows/prune-ghcr.yaml@v1
    with:
      packages: '["${{ github.event.repository.name }}"]'
      exclude-tags: "${{ github.event.repository.default_branch }}"
      exclude-latest: true
      exclude-semver: true
      keep-n-tagged: "10"
    secrets: inherit
